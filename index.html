<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Image Sequence Scrubber</title>
  <style>
    body { margin: 0; background: #111; color: #fff; font-family: sans-serif; }
    .player { max-width: 960px; margin: 40px auto; padding: 0 20px; }
    canvas { width: 100%; height: auto; display: block; background: #000; }
    input[type="range"] { width: 100%; margin-top: 16px; }
    .controls { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font-size: 14px; }
    .buttons { display: flex; gap: 10px; margin-top: 16px; }
    button {
      background: #2a2a2a; color: #fff; border: 1px solid #444;
      padding: 10px 20px; border-radius: 6px; cursor: pointer;
      font-size: 14px; transition: background 0.2s;
    }
    button:hover { background: #3a3a3a; }
    button:active { background: #444; }
  </style>
</head>
<body>
	<h1 align="center">Camissa - Black Sheep Full Body 360 View</h1>
  <div class="player">
    <canvas id="sequence"></canvas>
    <input id="scrubber" type="range" min="0" max="207" value="0" step="1">
    <div class="controls">
      <span id="frameLabel">Frame 1 / 208</span>
      <span>Drag to scrub</span>
    </div>
    <div class="buttons">
      <button id="playBtn">❚❚ Pause</button>
      <button id="stopBtn">■ Stop</button>
    </div>
  </div>
  <script>
    const FRAME_COUNT = 208;  // ← set to your REAL frame count
    const FPS = 25;           // ← playback speed

    const canvas = document.getElementById('sequence');
    const ctx = canvas.getContext('2d');
    const slider = document.getElementById('scrubber');
    const label = document.getElementById('frameLabel');
    const playBtn = document.getElementById('playBtn');
    const stopBtn = document.getElementById('stopBtn');

    slider.max = FRAME_COUNT - 1;

    const frames = [];
    for (let i = 0; i < FRAME_COUNT; i++) {
      const number = String(i + 1).padStart(5, '0');  // 5 digits, starts at 00001
      const img = new Image();
      img.src = `frames/frame_${number}.webp`;
      frames.push(img);
    }

    let currentFrame = 0;
    let isPlaying = false;
    let lastTime = 0;
    const frameDuration = 1000 / FPS;

    function drawFrame(index) {
      const img = frames[index];
      if (!img.complete || img.naturalWidth === 0) {
        img.onload = () => drawFrame(index);
        return;
      }
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      ctx.drawImage(img, 0, 0);
      label.textContent = `Frame ${index + 1} / ${FRAME_COUNT}`;
      slider.value = index;
    }

    function animate(timestamp) {
      if (!isPlaying) return;
      if (timestamp - lastTime >= frameDuration) {
        lastTime = timestamp;
        currentFrame++;
        if (currentFrame >= FRAME_COUNT) {
          currentFrame = 0; // loop back to start
        }
        drawFrame(currentFrame);
      }
      requestAnimationFrame(animate);
    }

    function play() {
      if (isPlaying) return;
      isPlaying = true;
      playBtn.textContent = '❚❚ Pause';
      lastTime = performance.now();
      requestAnimationFrame(animate);
    }

    function pause() {
      isPlaying = false;
      playBtn.textContent = '▶ Play';
    }

    // Stop now freezes on the CURRENT frame (no reset)
    function stop() {
      isPlaying = false;
      playBtn.textContent = '▶ Play';
      drawFrame(currentFrame);
    }

    playBtn.addEventListener('click', () => {
      isPlaying ? pause() : play();
    });

    stopBtn.addEventListener('click', stop);

    slider.addEventListener('input', () => {
      pause();
      currentFrame = Number(slider.value);
      drawFrame(currentFrame);
    });

    // Draw first frame, then AUTOPLAY on load
    drawFrame(0);
    window.addEventListener('load', () => {
      play();
    });
  </script>
</body>
</html>
